<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="description" content="Shoaib Jadallah - Computer Systems Engineer & Front-End Developer. Portfolio showcasing React, React Native, and full-stack projects." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.jpg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Shoaib Jadallah | Portfolio</title>
    <script>
      /* Applied before first paint so a light-theme visitor never sees a
         flash of the dark palette while React boots. */
      (function () {
        var root = document.documentElement;
        try {
          var saved = localStorage.getItem('theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          root.setAttribute('data-theme', theme);
        } catch (e) {
          root.setAttribute('data-theme', 'dark');
        }
        /* Language and direction must also be settled before first paint,
           otherwise an Arabic visitor sees the page laid out LTR and snap
           to RTL once React mounts. */
        try {
          var savedLang = localStorage.getItem('language');
          var lang =
            savedLang === 'ar' || savedLang === 'en'
              ? savedLang
              : (navigator.language || '').toLowerCase().indexOf('ar') === 0
              ? 'ar'
              : 'en';
          root.setAttribute('lang', lang);
          root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {
          root.setAttribute('lang', 'en');
          root.setAttribute('dir', 'ltr');
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
